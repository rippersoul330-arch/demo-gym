<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymPro Suite — Equipment</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
</style>
</head>
<body>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 8.5C2 7.1 3.1 6 4.5 6S7 7.1 7 8.5 5.9 11 4.5 11 2 9.9 2 8.5zM17 8.5c0-1.4 1.1-2.5 2.5-2.5S22 7.1 22 8.5 20.9 11 19.5 11 17 9.9 17 8.5zM2 15.5C2 14.1 3.1 13 4.5 13S7 14.1 7 15.5 5.9 18 4.5 18 2 16.9 2 15.5zM17 15.5c0-1.4 1.1-2.5 2.5-2.5S22 14.1 22 15.5 20.9 18 19.5 18 17 16.9 17 15.5z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text" id="sidebarGymName">GYMPRO</div>
      <div class="sidebar-logo-sub">Corp Management</div>
    </div>
  </div>

  <div class="nav-section-label">Main</div>
  <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
  <a href="gym-feature-members.html" class="nav-item"><i data-lucide="users"></i> Members</a>

  <div class="nav-section-label">Finance</div>
  <a href="gym-feature-finance.html" class="nav-item"><i data-lucide="landmark"></i> Finance</a>

  <a href="gym-feature-settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
      <div>
        <h1>Equipment & Inventory</h1>
        <p>Track machines, free weights, and maintenance schedules</p>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="controls-row">
      <button class="btn-primary" onclick="openEqModal()"><i data-lucide="plus" style="display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Add Equipment</button>
    </div>
    
    <div class="gym-table-container">
      <table class="gym-table">
        <thead>
          <tr>
            <th>Equipment Name</th>
            <th>Status</th>
            <th>Last Maintenance</th>
            <th>Next Maintenance</th>
            <th>Notes</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="eqTableBody">
          <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="eqModal">
  <div class="modal">
    <h2 id="modalTitle">Add Equipment</h2>
    <div class="form-group">
      <label>Equipment Name *</label>
      <input type="text" id="e_name" placeholder="e.g. Treadmill #3"/>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="e_status">
        <option value="operational">Operational</option>
        <option value="maintenance">Under Maintenance</option>
        <option value="broken">Broken / Out of Order</option>
      </select>
    </div>
    <div class="form-group" style="display:flex;gap:var(--space-4);">
      <div style="flex:1;">
        <label>Last Maintenance</label>
        <input type="date" id="e_last"/>
      </div>
      <div style="flex:1;">
        <label>Next Maintenance</label>
        <input type="date" id="e_next"/>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="e_notes" rows="2" placeholder="Any issues or parts ordered..."></textarea>
    </div>
    <input type="hidden" id="e_id"/>
    <button class="btn-primary" id="saveEqBtn" style="width:100%" onclick="saveEq()">Save Equipment</button>
    <button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="closeEqModal()">Cancel</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
lucide.createIcons();
const gymName = localStorage.getItem('gymProName') || 'GYMPRO';
document.getElementById('sidebarGymName').textContent = gymName.toUpperCase();

const SUPABASE_URL = 'https://oibhxzxplyqlnjfvtfug.supabase.co/rest/v1';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYmh4enhwbHlxbG5qZnZ0ZnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODI0OTksImV4cCI6MjA5Mzg1ODQ5OX0.jp3L_ltKA1RqH7v1v3KqOBF05Ql3HK2y7vfilt9upAM';
const headers = { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY };

let eqList = [];

function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type==='error'?'error':'');
  toast.innerHTML = `<i data-lucide="${type==='error'?'x-circle':'check-circle-2'}"></i> ${msg}`;
  container.appendChild(toast);
  lucide.createIcons();
  setTimeout(() => toast.remove(), 3000);
}

async function fetchEq() {
  try {
    const res = await fetch(`${SUPABASE_URL}/equipment?order=created_at.asc`, { headers });
    if(!res.ok) throw new Error("Failed to fetch equipment");
    eqList = await res.json();
    renderTable();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function renderTable() {
  const tbody = document.getElementById('eqTableBody');
  if (eqList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:var(--space-6);">No equipment added yet.</td></tr>';
    return;
  }
  
  tbody.innerHTML = eqList.map(e => {
    let badge = '';
    if (e.status === 'operational') badge = `<span class="badge" style="background:var(--green-soft);color:var(--green);">Operational</span>`;
    else if (e.status === 'maintenance') badge = `<span class="badge" style="background:var(--yellow-soft);color:var(--yellow);">Maintenance</span>`;
    else badge = `<span class="badge" style="background:rgba(200,16,46,0.15);color:#ff6b6b;">Broken</span>`;
    
    return `
    <tr>
      <td style="font-weight:600;color:var(--text);">${e.name}</td>
      <td>${badge}</td>
      <td style="color:var(--text-muted);">${e.last_maint || '—'}</td>
      <td style="color:var(--text-muted);">${e.next_maint || '—'}</td>
      <td style="color:var(--text-muted);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${e.notes||''}">${e.notes || '—'}</td>
      <td>
        <button class="btn-secondary" style="padding:4px 8px;font-size:10px;margin-right:4px;" onclick="editEq('${e.id}')">Edit</button>
        <button class="btn-primary" style="padding:4px 8px;font-size:10px;background:var(--surface-3);color:var(--red);border:1px solid var(--border);" onclick="deleteEq('${e.id}')">Del</button>
      </td>
    </tr>`;
  }).join('');
}

function openEqModal() {
  document.getElementById('modalTitle').textContent = 'Add Equipment';
  document.getElementById('e_id').value = '';
  document.getElementById('e_name').value = '';
  document.getElementById('e_status').value = 'operational';
  document.getElementById('e_last').value = '';
  document.getElementById('e_next').value = '';
  document.getElementById('e_notes').value = '';
  document.getElementById('eqModal').classList.add('active');
}

function closeEqModal() { document.getElementById('eqModal').classList.remove('active'); }

function editEq(id) {
  const e = eqList.find(x => x.id === id);
  if(!e) return;
  document.getElementById('modalTitle').textContent = 'Edit Equipment';
  document.getElementById('e_id').value = e.id;
  document.getElementById('e_name').value = e.name;
  document.getElementById('e_status').value = e.status;
  document.getElementById('e_last').value = e.last_maint || '';
  document.getElementById('e_next').value = e.next_maint || '';
  document.getElementById('e_notes').value = e.notes || '';
  document.getElementById('eqModal').classList.add('active');
}

async function saveEq() {
  const id = document.getElementById('e_id').value;
  const name = document.getElementById('e_name').value.trim();
  const status = document.getElementById('e_status').value;
  const last_maint = document.getElementById('e_last').value || null;
  const next_maint = document.getElementById('e_next').value || null;
  const notes = document.getElementById('e_notes').value.trim() || null;
  
  if (!name) return showToast('Name is required', 'error');

  const btn = document.getElementById('saveEqBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    if (id) {
      const res = await fetch(`${SUPABASE_URL}/equipment?id=eq.${id}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ name, status, last_maint, next_maint, notes })
      });
      if(!res.ok) throw new Error("Failed to update equipment");
      showToast('Equipment updated');
    } else {
      const res = await fetch(`${SUPABASE_URL}/equipment`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ name, status, last_maint, next_maint, notes })
      });
      if(!res.ok) throw new Error("Failed to add equipment");
      showToast('Equipment added');
    }
    
    closeEqModal();
    fetchEq();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Equipment';
  }
}

async function deleteEq(id) {
  if(!confirm("Are you sure you want to delete this equipment?")) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/equipment?id=eq.${id}`, { method: 'DELETE', headers });
    if(!res.ok) throw new Error("Failed to delete equipment");
    showToast('Equipment deleted');
    fetchEq();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('mobile-open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}

fetchEq();
</script>
</body>
</html>
