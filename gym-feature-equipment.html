<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymPro Suite — Equipment</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .badge { padding: 4px 10px; border-radius: var(--radius-full); font-weight: 700; font-size: 10px; text-transform: uppercase; }
  .badge.operational { background: var(--green-soft); color: var(--green); }
  .badge.maintenance { background: var(--yellow-soft); color: var(--yellow); }
  .badge.broken { background: rgba(200,16,46,0.15); color: #ff6b6b; }
</style>
</head>
<body>
<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 8.5C2 7.1 3.1 6 4.5 6S7 7.1 7 8.5 5.9 11 4.5 11 2 9.9 2 8.5zM17 8.5c0-1.4 1.1-2.5 2.5-2.5S22 7.1 22 8.5 20.9 11 19.5 11 17 9.9 17 8.5zM2 15.5C2 14.1 3.1 13 4.5 13S7 14.1 7 15.5 5.9 18 4.5 18 2 16.9 2 15.5zM17 15.5c0-1.4 1.1-2.5 2.5-2.5S22 14.1 22 15.5 20.9 18 19.5 18 17 16.9 17 15.5z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text">GYMPRO</div>
      <div class="sidebar-logo-sub">Corp Management</div>
    </div>
  </div>

  <div class="nav-section-label">Main</div>
  <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
  <a href="gym-feature-members.html" class="nav-item"><i data-lucide="users"></i> Members</a>
  <a href="gym-feature-attendance.html" class="nav-item"><i data-lucide="scan-line"></i> Check-In</a>
  <a href="gym-feature-taskboard.html" class="nav-item"><i data-lucide="calendar"></i> Taskboard</a>

  <div class="nav-section-label">Finance</div>
  <a href="gym-feature-finance.html" class="nav-item"><i data-lucide="landmark"></i> Finance</a>

  <div class="nav-section-label">Manage</div>
  <a href="gym-feature-equipment.html" class="nav-item active"><i data-lucide="dumbbell"></i> Equipment</a>
  <a href="gym-feature-reports.html" class="nav-item"><i data-lucide="bar-chart-2"></i> Reports</a>
  <a href="gym-feature-settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Equipment</h1>
      <p>Manage and track gym assets</p>
    </div>
  </div>

  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size: var(--text-lg); font-weight: 700;">Inventory</h2>
      <button class="btn-primary" onclick="openModal()"><i data-lucide="plus" style="width:16px;height:16px;display:inline-block;vertical-align:text-bottom;"></i> Add Equipment</button>
    </div>
    <div class="gym-table-container">
      <table class="gym-table">
        <thead>
          <tr>
            <th>Equipment Name</th>
            <th>Status</th>
            <th>Last Serviced</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="eqTable">
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="eqModal">
  <div class="modal">
    <h2>Add Equipment</h2>
    <div class="form-group">
      <label>Name (e.g. Treadmill #1)</label>
      <input type="text" id="e_name"/>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="e_status">
        <option value="operational">Operational</option>
        <option value="maintenance">Needs Maintenance</option>
        <option value="broken">Broken</option>
      </select>
    </div>
    <div class="form-group">
      <label>Last Serviced</label>
      <input type="date" id="e_service"/>
    </div>
    <button class="btn-primary" style="width:100%" onclick="saveEq()">Save Equipment</button>
    <button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
lucide.createIcons();
let eqList = JSON.parse(localStorage.getItem('gymProEq') || '[]');

function init() {
  if(!eqList.length) {
    eqList = [
      { id: '1', name: 'Treadmill #1', status: 'operational', service: '2026-04-15' },
      { id: '2', name: 'Treadmill #2', status: 'maintenance', service: '2025-11-20' },
      { id: '3', name: 'Squat Rack', status: 'operational', service: '2026-01-10' }
    ];
    save();
  }
  render();
}

function save() { localStorage.setItem('gymProEq', JSON.stringify(eqList)); }

function render() {
  const tbody = document.getElementById('eqTable');
  if(!eqList.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">No equipment found.</td></tr>';
    return;
  }
  tbody.innerHTML = eqList.map(e => `
    <tr>
      <td style="font-weight:600; color: var(--text);">${e.name}</td>
      <td><span class="badge ${e.status}">${e.status.replace('maintenance', 'Needs Maint.')}</span></td>
      <td><span style="color:var(--text-muted);"><i data-lucide="calendar" style="width:14px;height:14px;display:inline-block;vertical-align:text-bottom;"></i> ${e.service || '—'}</span></td>
      <td><button class="btn-secondary" style="padding: 6px 12px; font-size: 11px;" onclick="deleteEq('${e.id}')">Remove</button></td>
    </tr>
  `).join('');
  lucide.createIcons();
}

function openModal() {
  document.getElementById('e_name').value = '';
  document.getElementById('e_service').value = new Date().toISOString().split('T')[0];
  document.getElementById('eqModal').classList.add('active');
}

function closeModal() { document.getElementById('eqModal').classList.remove('active'); }

function saveEq() {
  const name = document.getElementById('e_name').value.trim();
  if(!name) return alert('Name required');
  eqList.push({
    id: Date.now().toString(),
    name,
    status: document.getElementById('e_status').value,
    service: document.getElementById('e_service').value
  });
  save(); render(); closeModal();
}

function deleteEq(id) {
  if(confirm('Delete equipment?')) {
    eqList = eqList.filter(e => e.id !== id);
    save(); render();
  }
}

init();
</script>
</body>
</html>
