<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymPro – Member Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh}
  header{background:linear-gradient(135deg,#ff6b35,#f7c59f22);padding:24px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #ffffff15}
  header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,#ff6b35,#ffbe7b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header span{font-size:.9rem;color:#aaa;margin-top:4px;display:block}
  .logo{width:48px;height:48px;background:linear-gradient(135deg,#ff6b35,#ffbe7b);border-radius:14px;display:grid;place-items:center;font-size:1.5rem}
  main{max-width:1100px;margin:0 auto;padding:32px 20px}
  .form-card{background:#161616;border:1px solid #ffffff12;border-radius:20px;padding:28px;margin-bottom:36px}
  .form-card h2{font-size:1.1rem;font-weight:700;margin-bottom:20px;color:#ff6b35}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid.three{grid-template-columns:1fr 1fr 1fr}
  .grid.four{grid-template-columns:repeat(4, 1fr)}
  label{font-size:.78rem;color:#aaa;font-weight:500;display:block;margin-bottom:5px}
  input,select{width:100%;background:#0d0d0d;border:1px solid #ffffff20;border-radius:10px;padding:10px 14px;color:#f0f0f0;font-family:inherit;font-size:.88rem;outline:none;transition:border .2s}
  input:focus,select:focus{border-color:#ff6b35}
  select option{background:#1a1a1a}
  .full{grid-column:1/-1}
  .btn{background:linear-gradient(135deg,#ff6b35,#ff8c5a);border:none;color:#fff;font-weight:700;font-size:.9rem;padding:12px 28px;border-radius:12px;cursor:pointer;transition:opacity .2s;font-family:inherit}
  .btn:hover{opacity:.85}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-row{margin-top:18px;display:flex;gap:12px;align-items:center}
  .msg{font-size:.82rem;padding:8px 14px;border-radius:8px;display:none}
  .msg.ok{background:#16a34a22;color:#4ade80;border:1px solid #4ade8033;display:block}
  .msg.err{background:#dc262622;color:#f87171;border:1px solid #f8717133;display:block}
  .section-title{font-size:1.1rem;font-weight:700;margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .card{background:#161616;border:1px solid #ffffff12;border-radius:20px;padding:24px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:#ff6b3550}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff6b35,#ffbe7b)}
  .card-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ff6b35,#ffbe7b);display:grid;place-items:center;font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:14px}
  .card-name{font-size:1rem;font-weight:700}
  .card-plan{display:inline-block;background:#ff6b3522;color:#ff8c5a;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:4px}
  .card-info{margin-top:14px;display:flex;flex-direction:column;gap:7px}
  .card-row{display:flex;justify-content:space-between;font-size:.8rem}
  .card-row .lbl{color:#888}
  .card-row .val{font-weight:600}
  .badge{padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
  .badge.active{background:#16a34a22;color:#4ade80}
  .badge.expired{background:#dc262622;color:#f87171}
  .badge.pending{background:#d9770622;color:#fb923c}
  .empty{text-align:center;padding:60px 20px;color:#555;font-size:.9rem}
  .count-bar{display:flex;gap:20px;margin-bottom:28px}
  .count-pill{background:#161616;border:1px solid #ffffff12;border-radius:14px;padding:14px 20px;flex:1;text-align:center}
  .count-pill .num{font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,#ff6b35,#ffbe7b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .count-pill .lbl{font-size:.75rem;color:#888;margin-top:2px}
  @media(max-width:600px){.grid,.grid.three,.grid.four{grid-template-columns:1fr}.count-bar{flex-wrap:wrap}}
</style>
</head>
<body>

<header>
  <div class="logo">💪</div>
  <div>
    <h1>GymPro</h1>
    <span>Member Management System</span>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="count-bar">
    <div class="count-pill"><div class="num" id="totalCount">0</div><div class="lbl">Total Members</div></div>
    <div class="count-pill"><div class="num" id="activeCount">0</div><div class="lbl">Active</div></div>
    <div class="count-pill"><div class="num" id="expiredCount">0</div><div class="lbl">Expired</div></div>
  </div>

  <!-- Add Member Form -->
  <div class="form-card">
    <h2>➕ Add New Member</h2>
    <div class="grid">
      <div>
        <label>Full Name *</label>
        <input id="f_name" placeholder="John Doe"/>
      </div>
      <div>
        <label>Phone *</label>
        <input id="f_phone" placeholder="+1 234 567 8900"/>
      </div>
      <div>
        <label>Email</label>
        <input id="f_email" type="email" placeholder="john@email.com"/>
      </div>
      <div>
        <label>Date of Birth</label>
        <input id="f_dob" type="date"/>
      </div>
    </div>
    <div class="grid four" style="margin-top:14px">
      <div>
        <label>Membership Plan *</label>
        <select id="f_plan" onchange="updateEndDate()">
          <option value="">Select plan</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly (3 mo)</option>
          <option value="half_yearly">Half-Yearly (6 mo)</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <div>
        <label>Start Date *</label>
        <input id="f_start" type="date" onchange="updateEndDate()"/>
      </div>
      <div>
        <label>End Date</label>
        <input id="f_end" type="date" disabled style="opacity: 0.7; cursor: not-allowed;"/>
      </div>
      <div>
        <label>Status</label>
        <select id="f_status">
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="expired">Expired</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="addBtn" onclick="addMember()">Add Member</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- Members Grid -->
  <div class="section-title">👥 Members</div>
  <div class="cards" id="cardsContainer">
    <div class="empty" id="emptyMsg">Loading members...</div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://oibhxzxplyqlnjfvtfug.supabase.co/rest/v1';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYmh4enhwbHlxbG5qZnZ0ZnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODI0OTksImV4cCI6MjA5Mzg1ODQ5OX0.jp3L_ltKA1RqH7v1v3KqOBF05Ql3HK2y7vfilt9upAM';
const TABLE = 'members';

const headers = {
  'Content-Type': 'application/json',
  'apikey': ANON_KEY,
  'Authorization': 'Bearer ' + ANON_KEY,
  'Prefer': 'return=representation'
};

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  setTimeout(() => el.className = 'msg', 3000);
}

function initDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f_start').value = today;
  updateEndDate();
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function calcExpiry(start, plan) {
  if (!start || !plan) return '—';
  const d = new Date(start);
  const map = { monthly: 30, quarterly: 90, half_yearly: 180, yearly: 365 };
  d.setDate(d.getDate() + (map[plan] || 30));
  return d.toISOString().split('T')[0];
}

function updateEndDate() {
  const start = document.getElementById('f_start').value;
  const plan = document.getElementById('f_plan').value;
  if (start && plan) {
    const end = calcExpiry(start, plan);
    document.getElementById('f_end').value = end !== '—' ? end : '';
  } else {
    document.getElementById('f_end').value = '';
  }
}

function renderCards(members) {
  const container = document.getElementById('cardsContainer');
  const emptyMsg = document.getElementById('emptyMsg');
  const active = members.filter(m => m.status === 'active').length;
  const expired = members.filter(m => m.status === 'expired').length;
  document.getElementById('totalCount').textContent = members.length;
  document.getElementById('activeCount').textContent = active;
  document.getElementById('expiredCount').textContent = expired;

  if (!members.length) {
    container.innerHTML = '<div class="empty" id="emptyMsg">No members yet. Add your first member above!</div>';
    return;
  }

  container.innerHTML = members.map(m => {
    const expiry = calcExpiry(m.start_date, m.plan);
    const planLabel = { monthly:'Monthly', quarterly:'Quarterly', half_yearly:'Half-Yearly', yearly:'Yearly' }[m.plan] || m.plan;
    return `
    <div class="card">
      <div class="card-avatar">${getInitials(m.name || '?')}</div>
      <div class="card-name">${m.name}</div>
      <div class="card-plan">${planLabel}</div>
      <div class="card-info">
        <div class="card-row"><span class="lbl">📞 Phone</span><span class="val">${m.phone || '—'}</span></div>
        ${m.email ? `<div class="card-row"><span class="lbl">✉️ Email</span><span class="val">${m.email}</span></div>` : ''}
        <div class="card-row"><span class="lbl">📅 Start</span><span class="val">${m.start_date || '—'}</span></div>
        <div class="card-row"><span class="lbl">⏳ Expires</span><span class="val">${expiry}</span></div>
        <div class="card-row"><span class="lbl">Status</span><span class="val"><span class="badge ${m.status}">${m.status}</span></span></div>
      </div>
    </div>`;
  }).join('');
}

async function loadMembers() {
  try {
    const res = await fetch(`${SUPABASE_URL}/${TABLE}?order=created_at.desc`, { headers });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    renderCards(data);
  } catch (e) {
    document.getElementById('cardsContainer').innerHTML = `<div class="empty">⚠️ Could not load members: ${e.message}</div>`;
  }
}

async function addMember() {
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const email = document.getElementById('f_email').value.trim();
  const dob = document.getElementById('f_dob').value;
  const plan = document.getElementById('f_plan').value;
  const start = document.getElementById('f_start').value;
  const end = document.getElementById('f_end').value;
  const status = document.getElementById('f_status').value;

  if (!name || !phone || !plan || !start) {
    showMsg('Please fill in all required fields (*)', 'err');
    return;
  }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = 'Adding...';

  const payload = { name, phone, email: email || null, date_of_birth: dob || null, plan, start_date: start, end_date: end, status };

  try {
    const res = await fetch(`${SUPABASE_URL}/${TABLE}`, {
      method: 'POST',
      headers,
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    showMsg('✅ Member added successfully!', 'ok');
    ['f_name','f_phone','f_email','f_dob'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_plan').value = '';
    document.getElementById('f_status').value = 'active';
    initDate();
    loadMembers();
  } catch (e) {
    showMsg('❌ Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Member';
  }
}

initDate();
loadMembers();
</script>
</body>
</html>
