<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymPro Suite — Taskboard</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .board {display: flex; gap: var(--space-4); overflow-x: auto; padding-bottom: 16px; min-height: 60vh;}
  .column {background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); min-width: 320px; flex: 1; display: flex; flex-direction: column;}
  .column-header {padding: 18px 20px; border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; align-items: center;}
  .column-title {font-weight: 700; font-size: var(--text-base); color: var(--text); display: flex; align-items: center; gap: 8px;}
  .column-title::before {content: ''; display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--red);}
  .col-todo .column-title::before {background: #ff6b6b;}
  .col-prog .column-title::before {background: var(--yellow);}
  .col-done .column-title::before {background: var(--green);}
  
  .task-count {background: var(--surface-3); padding: 2px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; color: var(--text-muted);}
  .task-list {padding: var(--space-4); flex: 1; display: flex; flex-direction: column; gap: var(--space-3); transition: background 0.2s; border-radius: 0 0 var(--radius-xl) var(--radius-xl);}
  .task-list.drag-over {background: rgba(255,255,255,0.03);}
  
  .task-card {background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; cursor: grab; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;}
  .task-card:active {cursor: grabbing;}
  .task-card:hover {border-color: var(--red); transform: translateY(-2px); box-shadow: var(--shadow-sm);}
  .task-card.dragging {opacity: 0.5; transform: scale(0.98);}
  
  .task-title {font-weight: 700; font-size: var(--text-sm); margin-bottom: 8px; color: var(--text);}
  .task-desc {font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;}
  .task-meta {display: flex; justify-content: space-between; align-items: center; font-size: 10px;}
  
  .task-badge {padding: 4px 10px; border-radius: var(--radius-full); font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;}
  .badge-high {background: rgba(200,16,46,0.15); color: #ff6b6b;}
  .badge-medium {background: var(--yellow-soft); color: var(--yellow);}
  .badge-low {background: var(--green-soft); color: var(--green);}
  
  .task-assignee {background: var(--surface-3); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 9px; color: #fff; border: 1px solid var(--border);}
  
  .add-task-btn {background: transparent; border: 1px dashed var(--border); color: var(--text-muted); padding: 14px; border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: var(--text-xs); font-weight: 600; text-align: center; margin: 0 var(--space-4) var(--space-4) var(--space-4); display: block;}
  .add-task-btn:hover {background: var(--surface-2); border-color: var(--red); color: var(--red);}
</style>
</head>
<body>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 8.5C2 7.1 3.1 6 4.5 6S7 7.1 7 8.5 5.9 11 4.5 11 2 9.9 2 8.5zM17 8.5c0-1.4 1.1-2.5 2.5-2.5S22 7.1 22 8.5 20.9 11 19.5 11 17 9.9 17 8.5zM2 15.5C2 14.1 3.1 13 4.5 13S7 14.1 7 15.5 5.9 18 4.5 18 2 16.9 2 15.5zM17 15.5c0-1.4 1.1-2.5 2.5-2.5S22 14.1 22 15.5 20.9 18 19.5 18 17 16.9 17 15.5z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text" id="sidebarGymName">GYMPRO</div>
      <div class="sidebar-logo-sub">Corp Management</div>
    </div>
  </div>

  <div class="nav-section-label">Main</div>
  <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
  <a href="gym-feature-members.html" class="nav-item"><i data-lucide="users"></i> Members</a>
  <a href="gym-feature-attendance.html" class="nav-item"><i data-lucide="scan-line"></i> Check-In</a>
  <a href="gym-feature-taskboard.html" class="nav-item active"><i data-lucide="calendar"></i> Taskboard</a>

  <div class="nav-section-label">Finance</div>
  <a href="gym-feature-finance.html" class="nav-item"><i data-lucide="landmark"></i> Finance</a>

  <div class="nav-section-label">Manage</div>
  <a href="gym-feature-equipment.html" class="nav-item"><i data-lucide="dumbbell"></i> Equipment</a>
  <a href="gym-feature-reports.html" class="nav-item"><i data-lucide="bar-chart-2"></i> Reports</a>
  <a href="gym-feature-settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
      <div>
        <h1>Taskboard</h1>
        <p>Manage staff tasks and maintenance requests</p>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="board">
      <!-- TO DO Column -->
      <div class="column col-todo">
        <div class="column-header">
          <div class="column-title">To Do</div>
          <div class="task-count" id="count-todo">0</div>
        </div>
        <div class="task-list" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
        <button class="add-task-btn" onclick="openModal('todo')">+ Add Task</button>
      </div>
      
      <!-- IN PROGRESS Column -->
      <div class="column col-prog">
        <div class="column-header">
          <div class="column-title">In Progress</div>
          <div class="task-count" id="count-prog">0</div>
        </div>
        <div class="task-list" id="prog" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
        <button class="add-task-btn" onclick="openModal('prog')">+ Add Task</button>
      </div>

      <!-- DONE Column -->
      <div class="column col-done">
        <div class="column-header">
          <div class="column-title">Done</div>
          <div class="task-count" id="count-done">0</div>
        </div>
        <div class="task-list" id="done" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
        <button class="add-task-btn" onclick="openModal('done')">+ Add Task</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2>New Task</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="t_title" placeholder="e.g. Fix treadmill #3"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="t_desc" rows="3" placeholder="Brief details about the task..."></textarea>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="t_prio">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
      </select>
    </div>
    <div class="form-group">
      <label>Assignee Initials</label>
      <input type="text" id="t_assignee" placeholder="e.g. AD" maxlength="2" style="text-transform: uppercase;"/>
    </div>
    <input type="hidden" id="t_col" />
    <button class="btn-primary" style="width:100%" id="saveTaskBtn" onclick="saveTask()">Save Task</button>
    <button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
lucide.createIcons();
const gymName = localStorage.getItem('gymProName') || 'GYMPRO';
document.getElementById('sidebarGymName').textContent = gymName.toUpperCase();

const SUPABASE_URL = 'https://oibhxzxplyqlnjfvtfug.supabase.co/rest/v1';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYmh4enhwbHlxbG5qZnZ0ZnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODI0OTksImV4cCI6MjA5Mzg1ODQ5OX0.jp3L_ltKA1RqH7v1v3KqOBF05Ql3HK2y7vfilt9upAM';
const headers = { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY };

let tasks = [];

function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type==='error'?'error':'');
  toast.innerHTML = `<i data-lucide="${type==='error'?'x-circle':'check-circle-2'}"></i> ${msg}`;
  container.appendChild(toast);
  lucide.createIcons();
  setTimeout(() => toast.remove(), 3000);
}

async function fetchTasks() {
  try {
    const res = await fetch(`${SUPABASE_URL}/tasks?order=created_at.asc`, { headers });
    if(!res.ok) throw new Error("Failed to fetch tasks");
    tasks = await res.json();
    renderBoard();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function renderBoard() {
  const cols = { 'todo': [], 'prog': [], 'done': [] };
  tasks.forEach(t => cols[t.col] && cols[t.col].push(t));
  
  ['todo', 'prog', 'done'].forEach(c => {
    document.getElementById(`count-${c}`).textContent = cols[c].length;
    document.getElementById(c).innerHTML = cols[c].map(t => {
      const pLabel = (t.prio || 'low').charAt(0).toUpperCase() + (t.prio || 'low').slice(1);
      return `
        <div class="task-card" draggable="true" ondragstart="drag(event)" id="task-${t.id}" data-id="${t.id}">
          <div style="display:flex;justify-content:space-between;">
            <div class="task-title">${t.title}</div>
            <button onclick="deleteTask('${t.id}')" style="color:var(--text-muted);font-size:14px;">&times;</button>
          </div>
          <div class="task-desc">${t.desc || ''}</div>
          <div class="task-meta">
            <span class="task-badge badge-${t.prio || 'low'}">${pLabel}</span>
            ${t.assignee ? `<span class="task-assignee">${t.assignee}</span>` : ''}
          </div>
        </div>`;
    }).join('');
  });
}

function openModal(col) {
  document.getElementById('t_col').value = col;
  document.getElementById('t_title').value = '';
  document.getElementById('t_desc').value = '';
  document.getElementById('t_prio').value = 'medium';
  document.getElementById('t_assignee').value = '';
  document.getElementById('taskModal').classList.add('active');
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('active');
}

async function saveTask() {
  const title = document.getElementById('t_title').value.trim();
  const desc = document.getElementById('t_desc').value.trim();
  const prio = document.getElementById('t_prio').value;
  const assignee = document.getElementById('t_assignee').value.trim().toUpperCase();
  const col = document.getElementById('t_col').value;
  
  if (!title) return showToast('Title is required', 'error');
  
  const btn = document.getElementById('saveTaskBtn');
  btn.disabled = true; btn.textContent = "Saving...";

  try {
    const res = await fetch(`${SUPABASE_URL}/tasks`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ title, desc, prio, assignee, col })
    });
    if(!res.ok) throw new Error("Failed to save task");
    
    closeModal();
    showToast('Task added successfully');
    fetchTasks();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = "Save Task";
  }
}

async function deleteTask(id) {
  try {
    const res = await fetch(`${SUPABASE_URL}/tasks?id=eq.${id}`, { method: 'DELETE', headers });
    if(!res.ok) throw new Error("Failed to delete task");
    showToast("Task deleted");
    fetchTasks();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

/* DRAG AND DROP */
function drag(ev) {
  ev.dataTransfer.setData("text", ev.target.dataset.id);
  setTimeout(() => ev.target.classList.add('dragging'), 0);
}

function allowDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.add('drag-over');
}

function dragLeave(ev) {
  ev.currentTarget.classList.remove('drag-over');
}

async function drop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const id = ev.dataTransfer.getData("text");
  const col = ev.currentTarget.id;
  
  const task = tasks.find(t => t.id === id);
  if (task && task.col !== col) {
    task.col = col;
    renderBoard(); // optimistic update
    
    try {
      const res = await fetch(`${SUPABASE_URL}/tasks?id=eq.${id}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ col })
      });
      if(!res.ok) throw new Error("Failed to move task");
    } catch (e) {
      showToast("Error moving task sync", "error");
      fetchTasks(); // revert optimistic update
    }
  }
}

document.addEventListener('dragend', e => {
  if (e.target.classList && e.target.classList.contains('task-card')) {
    e.target.classList.remove('dragging');
  }
});

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('mobile-open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}

fetchTasks();
</script>
</body>
</html>
