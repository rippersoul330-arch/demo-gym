<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymPro Suite — Members</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .grid.four { grid-template-columns: repeat(4, 1fr); }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-6); margin-bottom: var(--space-6); }
  .form-card h2 { font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-5); color: var(--text); display: flex; align-items: center; gap: 8px;}
  .btn-row { margin-top: var(--space-5); display: flex; gap: var(--space-3); align-items: center; }
  
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }
  .member-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-5); transition: box-shadow var(--transition), transform var(--transition); position: relative; overflow: hidden;}
  .member-card:hover { transform: translateY(-2px); border-color: var(--red); box-shadow: var(--shadow-md); }
  .member-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--red-dark), var(--red)); }
  .card-avatar { width: 48px; height: 48px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--red-deep), var(--red)); display: grid; place-items: center; font-size: var(--text-lg); font-family: var(--font-display); font-weight: 800; color: #fff; margin-bottom: var(--space-4); }
  .card-name { font-size: var(--text-lg); font-weight: 700; }
  .card-plan { display: inline-block; background: var(--red-soft); color: var(--red); font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: var(--radius-full); margin-top: 4px; }
  .card-info { margin-top: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
  .card-row { display: flex; justify-content: space-between; font-size: var(--text-xs); }
  .card-row .lbl { color: var(--text-muted); display:flex; align-items:center; gap: 6px;}
  .card-row .val { font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .badge.active { background: var(--green-soft); color: var(--green); }
  .badge.expired { background: rgba(200,16,46,0.15); color: #ff6b6b; }
  .badge.pending { background: var(--yellow-soft); color: var(--yellow); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: var(--text-sm); }
  .filter-bar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
  .filter-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; flex-shrink: 0; }
  .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 16px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .chip:hover { background: var(--surface-3); color: var(--text); }
  .chip.active { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; padding-left: 36px; box-sizing: border-box; }
  .search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; pointer-events: none; }
  .member-count { font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; flex-shrink: 0; padding: 6px 12px; background: var(--surface-2); border-radius: var(--radius-full); border: 1px solid var(--border); }
  @media(max-width:600px){.grid,.grid.four{grid-template-columns:1fr}.filter-bar{flex-direction:column;align-items:stretch}.search-wrap{min-width:100%}}
</style>
</head>
<body>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 8.5C2 7.1 3.1 6 4.5 6S7 7.1 7 8.5 5.9 11 4.5 11 2 9.9 2 8.5zM17 8.5c0-1.4 1.1-2.5 2.5-2.5S22 7.1 22 8.5 20.9 11 19.5 11 17 9.9 17 8.5zM2 15.5C2 14.1 3.1 13 4.5 13S7 14.1 7 15.5 5.9 18 4.5 18 2 16.9 2 15.5zM17 15.5c0-1.4 1.1-2.5 2.5-2.5S22 14.1 22 15.5 20.9 18 19.5 18 17 16.9 17 15.5z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text" id="sidebarGymName">GYMPRO</div>
      <div class="sidebar-logo-sub">Corp Management</div>
    </div>
  </div>

  <div class="nav-section-label">Main</div>
  <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
  <a href="gym-feature-members.html" class="nav-item active"><i data-lucide="users"></i> Members</a>

  <div class="nav-section-label">Finance</div>
  <a href="gym-feature-finance.html" class="nav-item"><i data-lucide="landmark"></i> Finance</a>

  <a href="gym-feature-settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
      <h1>Members</h1>
      <p>Manage gym members and subscriptions</p>
    </div>
    <div class="topbar-right">
      <div class="date-chip" id="topDate"></div>
    </div>
  </div>

  <div class="content">
    <!-- Add Member Form -->
    <div class="form-card">
      <h2><i data-lucide="user-plus" style="width: 20px; height: 20px; color: var(--red);"></i> Add New Member</h2>
      <div class="grid">
        <div>
          <label>Full Name *</label>
          <input id="f_name" placeholder="John Doe"/>
        </div>
        <div>
          <label>Phone *</label>
          <input id="f_phone" placeholder="+1 234 567 8900"/>
        </div>
        <div>
          <label>Date of Birth</label>
          <input id="f_dob" type="date"/>
        </div>
      </div>
      <div class="grid four" style="margin-top:14px">
        <div>
          <label>Membership Plan *</label>
          <select id="f_plan" onchange="updateEndDate()">
            <option value="">Select plan</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly (3 mo)</option>
            <option value="half_yearly">Half-Yearly (6 mo)</option>
            <option value="yearly">Yearly</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div id="f_custom_wrap" style="display:none;">
          <label>Custom Plan Name *</label>
          <input id="f_custom_name" placeholder="Student Plan" onchange="updateEndDate()"/>
        </div>
        <div id="f_custom_days_wrap" style="display:none;">
          <label>Custom Duration (Days) *</label>
          <input id="f_custom_days" type="number" min="1" placeholder="45" onchange="updateEndDate()"/>
        </div>
        <div>
          <label>Start Date *</label>
          <input id="f_start" type="date" onchange="updateEndDate()"/>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="addBtn" onclick="addMember()">Add Member</button>
      </div>
    </div>

    <!-- Members Grid -->
    <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);">
      <h2 style="font-size: var(--text-lg); font-weight: 700; margin:0;">Directory</h2>
      <span class="member-count" id="memberCountBadge">0 members</span>
    </div>
    <div class="filter-bar">
      <div class="filter-chips">
        <button class="chip active" id="chip-all" onclick="setMemberFilter('all', this)">All</button>
        <button class="chip" id="chip-active" onclick="setMemberFilter('active', this)">Active</button>
        <button class="chip" id="chip-pending" onclick="setMemberFilter('pending', this)">Pending</button>
        <button class="chip" id="chip-expired" onclick="setMemberFilter('expired', this)">Expired</button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="memberSearch" placeholder="Search by name or phone..." oninput="applyMemberFilter()" />
      </div>
    </div>
    <div class="cards" id="cardsContainer">
      <div class="empty" id="emptyMsg">Loading members...</div>
    </div>

  </div>
</div>

<!-- Renew Modal -->
<div class="modal-overlay" id="renewModal">
  <div class="modal">
    <h2>Renew Membership</h2>
    <div style="margin-bottom: var(--space-4); font-size: var(--text-sm); color: var(--text-muted);">
      Renewing for: <strong id="r_name" style="color: var(--text);"></strong>
    </div>
    <div class="form-group">
      <label>New Membership Plan *</label>
      <select id="r_plan" onchange="updateRenewFeeAndDate()">
        <option value="monthly">Monthly</option>
        <option value="quarterly">Quarterly (3 mo)</option>
        <option value="half_yearly">Half-Yearly (6 mo)</option>
        <option value="yearly">Yearly</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="form-group" id="r_custom_wrap" style="display:none;">
      <label>Custom Plan Name *</label>
      <input id="r_custom_name" placeholder="Student Plan" onchange="updateRenewFeeAndDate()"/>
    </div>
    <div class="form-group" id="r_custom_days_wrap" style="display:none;">
      <label>Custom Duration (Days) *</label>
      <input id="r_custom_days" type="number" min="1" placeholder="45" onchange="updateRenewFeeAndDate()"/>
    </div>
    <div class="form-group" style="background: var(--surface-2); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius-md); display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 600;">Total Fee</span>
      <span id="r_fee" style="font-size: var(--text-lg); font-family: var(--font-display); font-weight: 800; color: var(--red);">&#8377;1,500</span>
    </div>
    <div class="form-group" style="margin-top: var(--space-4);">
      <label>New Start Date *</label>
      <input id="r_start" type="date" onchange="updateRenewFeeAndDate()"/>
    </div>
    <div class="form-group">
      <label>New End Date</label>
      <input id="r_end" type="date" disabled style="opacity: 0.5; cursor: not-allowed;"/>
    </div>
    <input type="hidden" id="r_id"/>
    <button class="btn-primary" id="renewBtn" onclick="submitRenewal()" style="width: 100%; margin-top: var(--space-2);">Confirm Renewal & Payment</button>
    <button class="btn-secondary" onclick="closeRenewModal()" style="width: 100%; margin-top: var(--space-2);">Cancel</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
lucide.createIcons();

document.getElementById('topDate').innerHTML = `<i data-lucide="calendar" style="width:12px;height:12px;"></i> ` + new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const gymName = localStorage.getItem('gymProName') || 'GYMPRO';
document.getElementById('sidebarGymName').textContent = gymName.toUpperCase();

const SUPABASE_URL = 'https://oibhxzxplyqlnjfvtfug.supabase.co/rest/v1';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYmh4enhwbHlxbG5qZnZ0ZnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODI0OTksImV4cCI6MjA5Mzg1ODQ5OX0.jp3L_ltKA1RqH7v1v3KqOBF05Ql3HK2y7vfilt9upAM';
const headers = { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY };

const PLAN_PRICES = { monthly: 1500, quarterly: 4000, half_yearly: 7500, yearly: 12000 };
const formatINR = (amt) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amt);
const KNOWN_PLANS = ['monthly', 'quarterly', 'half_yearly', 'yearly'];

function parsePlan(plan) {
  if (!plan) return { key: '', label: '', days: 0 };
  const labels = { monthly: 'Monthly', quarterly: 'Quarterly', half_yearly: 'Half-Yearly', yearly: 'Yearly' };
  const daysMap = { monthly: 30, quarterly: 90, half_yearly: 180, yearly: 365 };
  if (KNOWN_PLANS.includes(plan)) return { key: plan, label: labels[plan], days: daysMap[plan] };
  if (plan.startsWith('custom|')) {
    const parts = plan.split('|');
    return { key: 'custom', label: parts[1] || 'Custom', days: Number(parts[2] || 0) };
  }
  return { key: 'custom', label: plan, days: 30 };
}

function buildPlanValue(planKey, customName, customDays) {
  if (planKey !== 'custom') return planKey;
  return `custom|${(customName || 'Custom').trim()}|${Number(customDays) || 0}`;
}

function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type==='error'?'error':'');
  toast.innerHTML = `<i data-lucide="${type==='error'?'x-circle':'check-circle-2'}"></i> ${msg}`;
  container.appendChild(toast);
  lucide.createIcons();
  setTimeout(() => toast.remove(), 3000);
}

function initDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f_start').value = today;
  updateEndDate();
}

function getInitials(name) {
  return (name||'?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function calcExpiry(start, plan) {
  if (!start || !plan) return '—';
  const d = new Date(start);
  d.setDate(d.getDate() + (parsePlan(plan).days || 30));
  return d.toISOString().split('T')[0];
}

function updateEndDate() {
  const endInput = document.getElementById('f_end');
  if (!endInput) return;
  const start = document.getElementById('f_start').value;
  const planKey = document.getElementById('f_plan').value;
  const showCustom = planKey === 'custom';
  document.getElementById('f_custom_wrap').style.display = showCustom ? 'block' : 'none';
  document.getElementById('f_custom_days_wrap').style.display = showCustom ? 'block' : 'none';
  const customName = document.getElementById('f_custom_name').value.trim();
  const customDays = Number(document.getElementById('f_custom_days').value);
  const plan = buildPlanValue(planKey, customName, customDays);
  if (start && planKey && (!showCustom || (customName && customDays > 0))) {
    const end = calcExpiry(start, plan);
    endInput.value = end !== '—' ? end : '';
  } else {
    endInput.value = '';
  }
}

function renderCards(members) {
  const container = document.getElementById('cardsContainer');
  
  if (!members.length) {
    container.innerHTML = '<div class="empty" id="emptyMsg">No members yet. Add your first member above!</div>';
    return;
  }

  container.innerHTML = members.map(m => {
    const expiry = calcExpiry(m.start_date, m.plan);
    const planLabel = parsePlan(m.plan).label || m.plan;
    return `
    <div class="member-card">
      <div class="card-avatar">${getInitials(m.name || '?')}</div>
      <div class="card-name">${m.name}</div>
      <div class="card-plan">${planLabel}</div>
      <div class="card-info">
        <div class="card-row"><span class="lbl"><i data-lucide="phone" style="width:12px;height:12px;"></i> Phone</span><span class="val">${m.phone || '—'}</span></div>
        ${m.email ? `<div class="card-row"><span class="lbl"><i data-lucide="mail" style="width:12px;height:12px;"></i> Email</span><span class="val">${m.email}</span></div>` : ''}
        <div class="card-row"><span class="lbl"><i data-lucide="calendar" style="width:12px;height:12px;"></i> Start</span><span class="val">${m.start_date || '—'}</span></div>
        <div class="card-row"><span class="lbl"><i data-lucide="clock" style="width:12px;height:12px;"></i> Expires</span><span class="val">${expiry}</span></div>
        <div class="card-row"><span class="lbl"><i data-lucide="activity" style="width:12px;height:12px;"></i> Status</span><span class="val"><span class="badge ${m.status}">${m.status}</span></span></div>
        <button class="btn-secondary" style="margin-top:var(--space-3);width:100%;padding:8px;font-size:var(--text-xs);" onclick="openRenewModal('${m.id}', '${(m.name || '').replace(/'/g, "\\'")}', '${m.plan}')">Renew</button>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

let allMembersData = [];
let currentMemberFilter = 'all';

function setMemberFilter(status, el) {
  currentMemberFilter = status;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyMemberFilter();
}

function applyMemberFilter() {
  const q = (document.getElementById('memberSearch').value || '').toLowerCase();
  let filtered = allMembersData.filter(m => {
    if (currentMemberFilter !== 'all' && m.status !== currentMemberFilter) return false;
    if (q && !(m.name||'').toLowerCase().includes(q) && !(m.phone||'').toLowerCase().includes(q)) return false;
    return true;
  });
  const badge = document.getElementById('memberCountBadge');
  if (badge) badge.textContent = `${filtered.length} member${filtered.length !== 1 ? 's' : ''}`;
  renderCards(filtered);
}

async function loadMembers() {
  try {
    const res = await fetch(`${SUPABASE_URL}/members?order=created_at.desc`, { headers });
    if (!res.ok) throw new Error(await res.text());
    allMembersData = await res.json();
    const badge = document.getElementById('memberCountBadge');
    if (badge) badge.textContent = `${allMembersData.length} member${allMembersData.length !== 1 ? 's' : ''}`;
    renderCards(allMembersData);
  } catch (e) {
    document.getElementById('cardsContainer').innerHTML = `<div class="empty">?? Could not load members: ${e.message}</div>`;
  }
}

async function addMember() {
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const dob = document.getElementById('f_dob').value;
  const planKey = document.getElementById('f_plan').value;
  const customName = document.getElementById('f_custom_name').value.trim();
  const customDays = Number(document.getElementById('f_custom_days').value);
  const plan = buildPlanValue(planKey, customName, customDays);
  const start = document.getElementById('f_start').value;
  const end = calcExpiry(start, plan);

  if (!name || !phone || !planKey || !start) return showToast('Please fill in all required fields (*)', 'error');
  if (planKey === 'custom' && (!customName || customDays <= 0)) return showToast('Please enter custom plan name and duration.', 'error');

  const btn = document.getElementById('addBtn');
  btn.disabled = true; btn.textContent = 'Adding...';

  const payload = { name, phone, date_of_birth: dob || null, plan, start_date: start, end_date: end, status: 'active' };

  try {
    const res = await fetch(`${SUPABASE_URL}/members`, { method: 'POST', headers, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error(await res.text());
    showToast('Member added successfully!');
    ['f_name','f_phone','f_dob'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_plan').value = '';
    document.getElementById('f_custom_name').value = '';
    document.getElementById('f_custom_days').value = '';
    initDate();
    loadMembers();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Add Member';
  }
}

function updateRenewFeeAndDate() {
  const planKey = document.getElementById('r_plan').value;
  const showCustom = planKey === 'custom';
  document.getElementById('r_custom_wrap').style.display = showCustom ? 'block' : 'none';
  document.getElementById('r_custom_days_wrap').style.display = showCustom ? 'block' : 'none';
  const customName = document.getElementById('r_custom_name').value.trim();
  const customDays = Number(document.getElementById('r_custom_days').value);
  const plan = buildPlanValue(planKey, customName, customDays);
  const start = document.getElementById('r_start').value;
  
  const fee = formatINR(PLAN_PRICES[planKey] || 0);
  document.getElementById('r_fee').textContent = fee;
  
  if (start && planKey && (!showCustom || (customName && customDays > 0))) {
    const end = calcExpiry(start, plan);
    document.getElementById('r_end').value = end !== '—' ? end : '';
  } else {
    document.getElementById('r_end').value = '';
  }
}

function openRenewModal(id, name, currentPlan) {
  const parsed = parsePlan(currentPlan);
  document.getElementById('r_id').value = id;
  document.getElementById('r_name').textContent = name;
  document.getElementById('r_plan').value = parsed.key || 'monthly';
  document.getElementById('r_custom_name').value = parsed.key === 'custom' ? parsed.label : '';
  document.getElementById('r_custom_days').value = parsed.key === 'custom' ? (parsed.days || '') : '';
  document.getElementById('r_start').value = new Date().toISOString().split('T')[0];
  
  updateRenewFeeAndDate();
  document.getElementById('renewModal').classList.add('active');
}

function closeRenewModal() { document.getElementById('renewModal').classList.remove('active'); }

async function submitRenewal() {
  const id = document.getElementById('r_id').value;
  const planKey = document.getElementById('r_plan').value;
  const customName = document.getElementById('r_custom_name').value.trim();
  const customDays = Number(document.getElementById('r_custom_days').value);
  const plan = buildPlanValue(planKey, customName, customDays);
  const start = document.getElementById('r_start').value;
  const end = document.getElementById('r_end').value;

  if (!planKey || !start) return showToast('Please fill in all required fields.', 'error');
  if (planKey === 'custom' && (!customName || customDays <= 0)) return showToast('Please enter custom plan name and duration.', 'error');

  const btn = document.getElementById('renewBtn');
  btn.disabled = true; btn.textContent = 'Processing...';

  try {
    const res = await fetch(`${SUPABASE_URL}/members?id=eq.${id}`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ plan, start_date: start, end_date: end, status: 'active' })
    });
    if (!res.ok) throw new Error(await res.text());
    
    showToast('Membership Renewed!');
    closeRenewModal();
    loadMembers();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Confirm Renewal & Payment';
  }
}

initDate();
loadMembers();

function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('mobile-open'); document.querySelector('.sidebar-overlay').classList.toggle('active'); }
</script>
