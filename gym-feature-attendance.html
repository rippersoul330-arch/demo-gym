<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymPro Suite — Attendance</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  .scanner-box { background: var(--surface-2); border: 2px dashed var(--border); border-radius: var(--radius-xl); height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: var(--space-5); transition: border-color 0.3s; }
  .scanner-box.scanning { border-color: var(--red); border-style: solid; box-shadow: 0 0 20px rgba(200,16,46,0.1); }
  .scanner-line { width: 80%; height: 2px; background: var(--red); box-shadow: 0 0 10px var(--red); margin-top: 20px; animation: scan 2s infinite ease-in-out; display: none; }
  .scanner-box.scanning .scanner-line { display: block; }
  @keyframes scan { 0% { transform: translateY(-30px); } 50% { transform: translateY(30px); } 100% { transform: translateY(-30px); } }
  
  .manual-entry { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); }
  
  .log-item { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--divider); }
  .log-item:last-child { border-bottom: none; }
  .log-time { font-size: var(--text-xs); color: var(--text-muted); font-family: monospace; }
  .log-name { font-weight: 600; font-size: var(--text-sm); }
  .log-plan { font-size: 10px; padding: 2px 8px; background: var(--surface-3); border-radius: var(--radius-full); color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-left: 8px;}
</style>
</head>
<body>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 8.5C2 7.1 3.1 6 4.5 6S7 7.1 7 8.5 5.9 11 4.5 11 2 9.9 2 8.5zM17 8.5c0-1.4 1.1-2.5 2.5-2.5S22 7.1 22 8.5 20.9 11 19.5 11 17 9.9 17 8.5zM2 15.5C2 14.1 3.1 13 4.5 13S7 14.1 7 15.5 5.9 18 4.5 18 2 16.9 2 15.5zM17 15.5c0-1.4 1.1-2.5 2.5-2.5S22 14.1 22 15.5 20.9 18 19.5 18 17 16.9 17 15.5z"/>
      </svg>
    </div>
    <div>
      <div class="sidebar-logo-text" id="sidebarGymName">GYMPRO</div>
      <div class="sidebar-logo-sub">Corp Management</div>
    </div>
  </div>

  <div class="nav-section-label">Main</div>
  <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
  <a href="gym-feature-members.html" class="nav-item"><i data-lucide="users"></i> Members</a>
  <a href="gym-feature-attendance.html" class="nav-item active"><i data-lucide="scan-line"></i> Check-In</a>
  <a href="gym-feature-taskboard.html" class="nav-item"><i data-lucide="calendar"></i> Taskboard</a>

  <div class="nav-section-label">Finance</div>
  <a href="gym-feature-finance.html" class="nav-item"><i data-lucide="landmark"></i> Finance</a>

  <div class="nav-section-label">Manage</div>
  <a href="gym-feature-equipment.html" class="nav-item"><i data-lucide="dumbbell"></i> Equipment</a>
  <a href="gym-feature-reports.html" class="nav-item"><i data-lucide="bar-chart-2"></i> Reports</a>
  <a href="gym-feature-settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
      <div>
        <h1>Daily Check-In</h1>
        <p>Log member attendance and verify active plans</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="date-chip" id="topDate"></div>
    </div>
  </div>

  <div class="content" style="max-width: 800px; margin: 0 auto; width: 100%;">
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-6);">
      
      <!-- CHECK IN PANEL -->
      <div>
        <div class="scanner-box" id="scanner">
          <i data-lucide="qr-code" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
          <p>Ready to scan QR / Barcode</p>
          <div class="scanner-line"></div>
        </div>

        <div style="font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;">Or Enter Manually</div>
        <div class="manual-entry">
          <input type="text" id="manualInput" placeholder="Member ID or Name" style="flex:1;"/>
          <button class="btn-primary" onclick="manualCheckIn()">Check In</button>
        </div>
        
        <div id="checkinResult" style="padding: 16px; border-radius: var(--radius-md); font-weight: 600; text-align: center; display: none;"></div>
      </div>

      <!-- LOG PANEL -->
      <div>
        <h2 style="font-size: var(--text-lg); margin-bottom: var(--space-4); border-bottom: 1px solid var(--divider); padding-bottom: 8px;">Today's Log <span id="logCount" style="font-size:12px; color:var(--text-muted); font-weight:normal; margin-left:8px;">(0)</span></h2>
        <div id="logContainer" style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); max-height: 400px; overflow-y: auto;">
          <div style="color:var(--text-muted); text-align:center; font-size:var(--text-sm);">Loading logs...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
lucide.createIcons();
document.getElementById('topDate').innerHTML = `<i data-lucide="calendar" style="width:12px;height:12px;"></i> ` + new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const gymName = localStorage.getItem('gymProName') || 'GYMPRO';
document.getElementById('sidebarGymName').textContent = gymName.toUpperCase();

const SUPABASE_URL = 'https://oibhxzxplyqlnjfvtfug.supabase.co/rest/v1';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYmh4enhwbHlxbG5qZnZ0ZnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODI0OTksImV4cCI6MjA5Mzg1ODQ5OX0.jp3L_ltKA1RqH7v1v3KqOBF05Ql3HK2y7vfilt9upAM';
const headers = { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY };

let dbMembers = [];
const todayStr = new Date().toISOString().split('T')[0];

async function initData() {
  try {
    const res = await fetch(`${SUPABASE_URL}/members`, { headers });
    if(res.ok) dbMembers = await res.json();
    renderLogs();
  } catch(e) {
    console.error("Failed to load members", e);
  }
}

async function renderLogs() {
  const container = document.getElementById('logContainer');
  try {
    const res = await fetch(`${SUPABASE_URL}/attendance?date=eq.${todayStr}&order=created_at.desc`, { headers });
    if(!res.ok) throw new Error("Failed");
    const logs = await res.json();
    
    document.getElementById('logCount').textContent = `(${logs.length})`;
    
    if(!logs.length) {
      container.innerHTML = '<div style="color:var(--text-muted); text-align:center; font-size:var(--text-sm);">No check-ins yet today.</div>';
      return;
    }
    
    container.innerHTML = logs.map(log => `
      <div class="log-item">
        <div>
          <span class="log-name">${log.member_name}</span>
          <span class="log-plan">${log.plan || 'Plan'}</span>
        </div>
        <span class="log-time">${log.time}</span>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '<div style="color:var(--text-muted); text-align:center;">Error loading logs.</div>';
  }
}

async function checkIn(query) {
  const resBox = document.getElementById('checkinResult');
  resBox.style.display = 'block';
  resBox.className = '';
  
  if(!dbMembers.length) {
    resBox.innerHTML = `⚠️ Database not loaded yet.`;
    resBox.style.background = 'rgba(245,166,35,0.15)';
    resBox.style.color = 'var(--yellow)';
    return;
  }

  const q = query.toLowerCase();
  const m = dbMembers.find(x => x.name.toLowerCase() === q || x.id.substring(0,6) === q);

  if (!m) {
    resBox.innerHTML = `❌ Member not found.`;
    resBox.style.background = 'rgba(200,16,46,0.15)';
    resBox.style.color = '#ff6b6b';
    return;
  }

  if (m.status === 'expired' || m.status === 'pending') {
    resBox.innerHTML = `⚠️ Access Denied: Plan is ${m.status.toUpperCase()}.`;
    resBox.style.background = 'rgba(245,166,35,0.15)';
    resBox.style.color = 'var(--yellow)';
    return;
  }

  // Record Attendance in Supabase
  const timeStr = new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
  
  try {
    const res = await fetch(`${SUPABASE_URL}/attendance`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ member_name: m.name, plan: m.plan, time: timeStr, date: todayStr })
    });
    if(!res.ok) throw new Error("Failed to save check-in");
    
    resBox.innerHTML = `✅ Access Granted: ${m.name}`;
    resBox.style.background = 'var(--green-soft)';
    resBox.style.color = 'var(--green)';
    
    renderLogs();
  } catch (e) {
    resBox.innerHTML = `❌ Server Error: ${e.message}`;
    resBox.style.background = 'rgba(200,16,46,0.15)';
    resBox.style.color = '#ff6b6b';
  }
}

function manualCheckIn() {
  const input = document.getElementById('manualInput');
  if(!input.value.trim()) return;
  
  const scanner = document.getElementById('scanner');
  scanner.classList.add('scanning');
  
  setTimeout(() => {
    scanner.classList.remove('scanning');
    checkIn(input.value.trim());
    input.value = '';
  }, 600);
}

document.getElementById('manualInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') manualCheckIn();
});

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('mobile-open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}

initData();
</script>
</body>
</html>
